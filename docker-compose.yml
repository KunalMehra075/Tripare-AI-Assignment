version: '3.8'

services:
  temporal:
    container_name: temporal-server
    image: temporalio/auto-setup:1.24.2
    ports:
      - "7233:7233"
    environment:
      - DB=sqlite
      - DYNAMIC_CONFIG_FILE_PATH=/etc/temporal/config/dynamicconfig/development-sqlite.yaml
    volumes:
      - temporal-data:/etc/temporal/data
    networks:
      - temporal-network

  temporal-ui:
    container_name: temporal-ui
    image: temporalio/ui:2.26.2
    ports:
      - "8080:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000,http://localhost:5173
    depends_on:
      - temporal
    networks:
      - temporal-network

volumes:
  temporal-data:

networks:
  temporal-network:
    driver: bridge
